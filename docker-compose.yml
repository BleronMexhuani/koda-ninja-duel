services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: koda
      POSTGRES_PASSWORD: koda
      POSTGRES_DB: koda
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koda -d koda"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  app:
    build: .
    environment:
      DATABASE_URL: postgres://koda:koda@db:5432/koda?sslmode=disable
      PORT: "8080"
      COOKIE_SECURE: "false"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
